<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nguyễn Nam Hùng · Thử nhân vật 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#17223a;font:16px system-ui,sans-serif}main{width:min(960px,100%);margin:auto;padding:24px}h1{margin:12px 0 4px}p{margin:0 0 14px;color:#4c5870}#stage{position:relative;height:clamp(340px,65vh,650px);background:radial-gradient(ellipse at center,#fff,#e7ecf8);border-radius:24px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:pan-y}#status{position:absolute;top:0;left:0;padding:16px}#stage img{width:100%;height:100%;object-fit:contain}a{color:inherit}button{margin-top:14px;padding:8px 14px}
</style>

<main>
<a href="./">← Portfolio</a>
<h1>Nhân vật 3D</h1>
<p>Rê chuột quanh nhân vật để kiểm tra hướng nhìn. Dừng lại để xem tư thế làm việc.</p>
<div id="stage"><img src="assets/hung-approved.webp" alt="Ảnh nhân vật Hùng"><p id="status" role="status">Đang tải nhân vật…</p></div>
<button id="export" hidden>Tải model GLB</button>
</main>
<script type="module">
import('./character-3d.bundle.js').catch(error => {
  document.querySelector('#status').textContent = 'Không tải được mô hình 3D. Đang hiển thị ảnh nhân vật.';
  console.error(error);
});
</script>
</html>
