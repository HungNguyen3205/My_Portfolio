<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model 3D · Nguyễn Nam Hùng</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#192338;font:16px system-ui,sans-serif}
main{width:min(100%,1020px);margin:auto;padding:24px}h1{margin-bottom:4px}p{color:#485570}
#stage{position:relative;height:clamp(360px,65vh,700px);background:radial-gradient(ellipse,#fff,#e2e9fa);border-radius:20px;overflow:hidden}
#stage img{width:100%;height:100%;object-fit:contain}#status{position:absolute;top:0;left:16px}canvas{display:block;width:100%;height:100%;touch-action:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}button{padding:8px 14px}button[aria-pressed="true"]{background:#203c70;color:#fff}
</style>
<main>
<a href="./">← Portfolio</a>
<h1>Nhân vật Hùng · Model 3D</h1>
<p>Rê chuột để nhân vật quay đầu. Tắt chế độ theo chuột để kéo xoay model.</p>
<div id="stage"><img src="assets/hung-approved.webp" alt="Ảnh tham chiếu nhân vật Hùng"><p id="status" role="status">Đang tải model…</p></div>
<div class="controls">
<button type="button" id="follow" aria-pressed="false" disabled>Theo chuột</button>
<button type="button" data-angle="0" disabled>Chính diện</button>
<button type="button" data-angle="-35" disabled>Góc trái</button>
<button type="button" data-angle="35" disabled>Góc phải</button>
<a href="assets/hung-model.glb" download>Tải GLB đã tối ưu</a>
</div>
</main>
<script type="module">
import('./character-model.bundle.js?v=head-motion').catch(error => {
  document.querySelector('#status').textContent = 'Không tải được trình xem 3D. Anh vẫn có thể tải GLB bên dưới.';
  console.error(error);
});
</script>
</html>
